{% extends "base.html" %}
{% block title %}Profile{% endblock %}

{% block content %}
<div class="form-container">
    <div class="form-card">
        <div class="card-header">
            <h2 class="card-title"><i class="fas fa-user-circle"></i> My Profile</h2>
        </div>
        <div style="text-align: center; margin-bottom: 1.5rem;">
            <i class="fas fa-user-circle" style="font-size: 4rem; color: #4f46e5;"></i>
            <h3 style="color: #0f172a; margin-top: 0.5rem;">{{ user.full_name }}</h3>
        </div>
        <form method="POST">
            <div class="form-group">
                <label class="form-label"><i class="fas fa-user"></i> Full Name</label>
                <input type="text" name="full_name" class="form-control" value="{{ user.full_name }}" required>
            </div>
            <div class="form-group">
                <label class="form-label"><i class="fas fa-user-circle"></i> Username</label>
                <input type="text" class="form-control" value="{{ user.username }}" disabled>
            </div>
            <div class="form-group">
                <label class="form-label"><i class="fas fa-envelope"></i> Email</label>
                <input type="email" name="email" class="form-control" value="{{ user.email }}" required>
            </div>
            <div class="form-group">
                <label class="form-label"><i class="fas fa-phone"></i> Phone</label>
                <input type="tel" name="phone" class="form-control" value="{{ user.phone or '' }}">
            </div>
            <div class="form-group">
                <label class="form-label"><i class="fas fa-map-marker-alt"></i> Address</label>
                <textarea name="address" class="form-control" rows="2">{{ user.address or '' }}</textarea>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%;"><i class="fas fa-save"></i> Update Profile</button>
        </form>
    </div>
</div>
{% endblock %}
