{% extends "base.html" %}
{% block title %}Transfer{% endblock %}

{% block content %}
<div class="form-container">
    <div class="form-card">
        <div class="card-header">
            <h2 class="card-title"><i class="fas fa-exchange-alt"></i> Transfer Money</h2>
        </div>
        <form method="POST">
            <div class="form-group">
                <label class="form-label"><i class="fas fa-arrow-right"></i> From Account</label>
                <select name="from_account" class="form-control" required>
                    <option value="">Select account</option>
                    {% for account in accounts %}
                    <option value="{{ account.id }}">{{ account.account_number }} (₹{{ account.balance|round(2) }})</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label class="form-label"><i class="fas fa-arrow-left"></i> To Account Number</label>
                <input type="text" name="to_account" class="form-control" placeholder="Receiver's account number" required>
            </div>
            <div class="form-group">
                <label class="form-label"><i class="fas fa-rupee-sign"></i> Amount (₹)</label>
                <input type="number" name="amount" class="form-control" min="1" step="1" required>
            </div>
            <div class="form-group">
                <label class="form-label"><i class="fas fa-pen"></i> Description (Optional)</label>
                <input type="text" name="description" class="form-control" placeholder="e.g., Payment">
            </div>
            <button type="submit" class="btn btn-warning" style="width: 100%;"><i class="fas fa-exchange-alt"></i> Transfer</button>
        </form>
    </div>
</div>
{% endblock %}
