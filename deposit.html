{% extends "base.html" %}
{% block title %}Deposit{% endblock %}

{% block content %}
<div class="form-container">
    <div class="form-card">
        <div class="card-header">
            <h2 class="card-title"><i class="fas fa-arrow-down"></i> Deposit Money</h2>
        </div>
        <form method="POST">
            <div class="form-group">
                <label class="form-label"><i class="fas fa-university"></i> Select Account</label>
                <select name="account_id" class="form-control" required>
                    <option value="">Choose account</option>
                    {% for account in accounts %}
                    <option value="{{ account.id }}">{{ account.account_number }} (₹{{ account.balance|round(2) }})</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label class="form-label"><i class="fas fa-rupee-sign"></i> Amount (₹)</label>
                <input type="number" name="amount" class="form-control" min="1" step="1" required>
            </div>
            <div class="form-group">
                <label class="form-label"><i class="fas fa-pen"></i> Description (Optional)</label>
                <input type="text" name="description" class="form-control" placeholder="e.g., Cash deposit">
            </div>
            <button type="submit" class="btn btn-secondary" style="width: 100%;"><i class="fas fa-arrow-down"></i> Deposit</button>
        </form>
    </div>
</div>
{% endblock %}
