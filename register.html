{% extends "base.html" %}
{% block title %}Register{% endblock %}

{% block content %}
<div class="form-container">
    <div class="form-card">
        <div class="card-header">
            <h2 class="card-title"><i class="fas fa-user-plus"></i> Create Account</h2>
        </div>
        <form method="POST">
            <div class="form-group">
                <label class="form-label"><i class="fas fa-user"></i> Full Name</label>
                <input type="text" name="full_name" class="form-control" placeholder="Enter your full name" required>
            </div>
            <div class="form-group">
                <label class="form-label"><i class="fas fa-user-circle"></i> Username</label>
                <input type="text" name="username" class="form-control" placeholder="Choose a username" required>
            </div>
            <div class="form-group">
                <label class="form-label"><i class="fas fa-envelope"></i> Email</label>
                <input type="email" name="email" class="form-control" placeholder="Enter your email" required>
            </div>
            <div class="form-group">
                <label class="form-label"><i class="fas fa-phone"></i> Phone Number</label>
                <input type="tel" name="phone" class="form-control" placeholder="Enter phone number">
            </div>
            <div class="form-group">
                <label class="form-label"><i class="fas fa-map-marker-alt"></i> Address</label>
                <textarea name="address" class="form-control" rows="2" placeholder="Enter your address"></textarea>
            </div>
            <div class="form-group">
                <label class="form-label"><i class="fas fa-lock"></i> Password</label>
                <input type="password" name="password" class="form-control" placeholder="Create password" required>
            </div>
            <div class="form-group">
                <label class="form-label"><i class="fas fa-check-circle"></i> Confirm Password</label>
                <input type="password" name="confirm_password" class="form-control" placeholder="Confirm password" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%;"><i class="fas fa-user-plus"></i> Register</button>
        </form>
        <div style="text-align: center; margin-top: 1.5rem;">
            <p style="color: #64748b; font-size: 0.85rem;">Already have an account? <a href="{{ url_for('login') }}" style="color: #4f46e5;">Login here</a></p>
        </div>
    </div>
</div>
{% endblock %}
