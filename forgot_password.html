{% extends "base.html" %}
{% block title %}Forgot Password{% endblock %}

{% block content %}
<div class="form-container">
    <div class="form-card">
        <div class="card-header">
            <h2 class="card-title"><i class="fas fa-key"></i> Reset Password</h2>
        </div>
        <form method="POST">
            <div class="form-group">
                <label class="form-label"><i class="fas fa-envelope"></i> Email Address</label>
                <input type="email" name="email" class="form-control" placeholder="Enter your email" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%;"><i class="fas fa-paper-plane"></i> Send Reset Link</button>
        </form>
        <div style="text-align: center; margin-top: 1.5rem;">
            <a href="{{ url_for('login') }}" style="color: #4f46e5;">Back to Login</a>
        </div>
    </div>
</div>
{% endblock %}
