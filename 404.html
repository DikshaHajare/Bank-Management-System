{% extends "base.html" %}
{% block title %}Page Not Found{% endblock %}

{% block content %}
<div style="text-align: center; padding: 4rem 1rem;">
    <i class="fas fa-exclamation-triangle" style="font-size: 5rem; color: #f59e0b;"></i>
    <h1 style="font-size: 5rem; color: white; margin: 1rem 0;">404</h1>
    <h2 style="color: rgba(255,255,255,0.9);">Page Not Found</h2>
    <p style="color: rgba(255,255,255,0.7); max-width: 500px; margin: 1rem auto 2rem;">
        The page you're looking for doesn't exist or has been moved.
    </p>
    <a href="{{ url_for('home') }}" class="btn btn-primary"><i class="fas fa-home"></i> Go Home</a>
</div>
{% endblock %}
