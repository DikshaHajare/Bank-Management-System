{% extends "base.html" %}
{% block title %}Login{% endblock %}

{% block content %}
<div class="form-container">
    <div class="form-card">
        <div class="card-header">
            <h2 class="card-title"><i class="fas fa-sign-in-alt"></i> Login</h2>
        </div>
        <form method="POST">
            <div class="form-group">
                <label class="form-label"><i class="fas fa-user"></i> Username</label>
                <input type="text" name="username" class="form-control" placeholder="Enter username" required>
            </div>
            <div class="form-group">
                <label class="form-label"><i class="fas fa-lock"></i> Password</label>
                <input type="password" name="password" class="form-control" placeholder="Enter password" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%;"><i class="fas fa-sign-in-alt"></i> Login</button>
        </form>
        <div style="text-align: center; margin-top: 1.5rem;">
            <p style="color: #64748b; font-size: 0.85rem;">Don't have an account? <a href="{{ url_for('register') }}" style="color: #4f46e5;">Register here</a></p>
            <p style="color: #64748b; font-size: 0.85rem;"><a href="{{ url_for('forgot_password') }}" style="color: #4f46e5;">Forgot Password?</a></p>
            <hr style="margin: 1rem 0;">
            <p style="color: #64748b; font-size: 0.8rem;">Demo Admin: <strong>admin / admin123</strong></p>
        </div>
    </div>
</div>
{% endblock %}
